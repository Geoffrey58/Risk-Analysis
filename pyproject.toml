[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-analysis"
version = "0.1.0"
description = "Calcolo del rischio R = f(P, M, V) per più ambiti: sicurezza sul lavoro, cybersecurity e altri"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["risk_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
